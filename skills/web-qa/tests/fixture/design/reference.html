<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trang đặt lịch</title>
<style>
  /* Token: xem tokens.md. */
  :root {
    --color-primary: #2563eb;
    --color-text: #1f2937;
    --color-surface: #f3f4f6;
    --space-header: 16px;
  }
  * { box-sizing: border-box; animation: none !important; transition: none !important; }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    display: grid; grid-template-rows: 96px 48px 1fr 72px;
    font-family: Arial, Helvetica, sans-serif; color: var(--color-text); background: #ffffff;
  }
  #page-header { padding: var(--space-header) 32px; background: #111827; color: #ffffff; }
  #page-header h1 { margin: 0; font-size: 28px; line-height: 40px; }
  #page-nav { display: flex; gap: 24px; align-items: center; padding: 0 32px; background: var(--color-surface); }
  #page-nav a { color: var(--color-text); text-decoration: none; font-size: 16px; }
  #page-main { padding: 32px; }
  #page-main h2 { margin: 0 0 12px; font-size: 22px; }
  #page-main p { margin: 0 0 24px; max-width: 640px; line-height: 1.5; }
  #primary-action {
    display: inline-block; padding: 12px 28px; border: 0; border-radius: 6px;
    background: var(--color-primary); color: #ffffff; font-size: 16px; font-weight: 700;
  }
  #page-footer { display: flex; align-items: center; justify-content: center; background: var(--color-surface); font-size: 14px; }
</style>
</head>
<body>
<header id="page-header">
  <h1>Lịch hẹn của bạn</h1>
</header>
<nav id="page-nav" aria-label="Điều hướng chính">
  <a href="#">Trang chủ</a>
  <a href="#">Lịch hẹn</a>
  <a href="#">Hỗ trợ</a>
</nav>
<main id="page-main">
  <h2>Chọn một khung giờ</h2>
  <p>Chọn ngày và giờ phù hợp, sau đó xác nhận để giữ chỗ. Bạn có thể đổi lịch miễn phí trước giờ hẹn một ngày.</p>
  <button id="primary-action" type="button">Xác nhận lịch hẹn</button>
</main>
<footer id="page-footer">
  <p>Dịch vụ mẫu · Hotline 1900 0000</p>
</footer>
</body>
</html>
