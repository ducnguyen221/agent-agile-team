# Môi trường dev trên máy lập trình viên, chỉ mở cổng trên localhost.
# GIÁ TRỊ GIẢ: mật khẩu dưới đây là placeholder cho máy dev.
services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_ENV: development
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: changeme
    ports: ["127.0.0.1:5432:5432"]
