# Kiểm mọi nhánh trên ba hệ điều hành × hai phiên bản Python: bộ test, lõi sạch, tài liệu mẫu.
# Action ghim SHA commit (lấy bằng `gh api repos/<action>/git/ref/tags/<tag>`); đổi bản thì đổi cả SHA lẫn chú thích.
# Danh sách từ cấm nằm ngoài repo nên CI không có: luật chống rò báo NOT_CONFIGURED, test chống rò skip có lý do.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Tests
        run: python -m pytest -q

      - name: Core is clean (check --self)
        run: python scripts/check.py --self

      - name: Samples and templates pass check
        run: python scripts/check.py samples templates
