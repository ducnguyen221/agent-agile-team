# Kiểm mọi nhánh trên ba hệ điều hành × hai phiên bản Python: bộ test, lõi sạch, tài liệu mẫu.
# Action ghim SHA commit (lấy bằng `gh api repos/<action>/git/ref/tags/<tag>`); đổi bản thì đổi cả SHA lẫn chú thích.
# Danh sách từ cấm nằm ngoài repo nên CI không có: luật chống rò báo NOT_CONFIGURED, test chống rò skip có lý do.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest = Ubuntu 26.04 từ 11/2026, không còn Python 3.9 → ghim 24.04 cho riêng 3.9.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Kiểm sàn cứng so với base (SPR-16 FR2.4): mã `floor_check.py` lấy từ BẢN CỦA BASE (git archive), không gọi script nào
      # của head trước đó. Nhãn `floor-approved` (do Đức gắn) chuyển sang `--mode report`: liệt kê, không chặn.
      # Bước đứng NGAY SAU checkout/setup-python, trước mọi bước chạy mã head (Tests, check --self), để mã head chưa kịp ghi GITHUB_ENV/PATH.
      # Khe hở công bố: workflow của PR do head cung cấp nên PR có thể sửa chính bước này (nằm trong FLOOR_FILES, hiện trong
      # diff); nhãn `floor-approved` không gắn với SHA của head (commit đẩy thêm sau khi gắn nhãn vẫn ở chế độ report); bước này là "rào hành vi có kiểm" cho tới khi SPR-17 nghiệm thu cách chạy workflow-từ-base.
      - name: Floor vs base (san-cung)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          FLOOR_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'floor-approved') && 'report' || 'strict' }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$BASE_REF"
          base_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/floor-base.XXXXXX")"
          git archive FETCH_HEAD scripts | /usr/bin/tar -x -C "$base_dir"
          if [ ! -f "$base_dir/scripts/floor_check.py" ]; then
            echo "bootstrap — chưa kiểm so base"
            exit 0
          fi
          "${PYTHON:-python}" -X utf8 "$base_dir/scripts/floor_check.py" --base FETCH_HEAD --mode "$FLOOR_MODE"

      # Ghim: pytest 9.x đòi Python >= 3.10; 8.4.2 là bản cuối chạy được cả 3.9 lẫn 3.13 (bộ test đã chạy xanh với nó).
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Tests
        run: python -m pytest -q

      - name: Core is clean (check --self)
        run: python scripts/check.py --self

      - name: Samples and templates pass check
        run: python scripts/check.py samples templates
